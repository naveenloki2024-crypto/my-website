<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | RARE HABIT Admin</title>
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

    <div class="admin-shell">

        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-mark">RH</div>
                <div>
                    <div class="sidebar-brand-name">RARE HABIT</div>
                    <div class="sidebar-brand-sub">Admin Panel</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="/admin/dashboard.html" class="nav-item">
                    <span class="nav-icon">&#9632;</span> Dashboard
                </a>
                <a href="/admin/orders.html" class="nav-item active">
                    <span class="nav-icon">&#9776;</span> Orders
                </a>
                <a href="/admin/products.html" class="nav-item">
                    <span class="nav-icon">&#9998;</span> Products
                </a>
            </nav>

            <div class="sidebar-user">
                <div class="sidebar-user-top">
                    <div id="adminAvatar" class="sidebar-user-avatar">RH</div>
                    <div class="sidebar-user-info">
                        <div id="adminName" class="sidebar-user-name">Administrator</div>
                        <div id="adminRole" class="sidebar-user-role">Admin</div>
                    </div>
                </div>
                <button type="button" id="logoutBtn" class="btn btn-ghost" style="width:100%;color:#e7e7e2;border-color:rgba(255,255,255,.18);">
                    Sign out
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Orders</h1>
                    <div class="topbar-meta">All orders from every channel</div>
                </div>
                <div class="topbar-actions">
                    <button type="button" id="sidebarToggle" class="mobile-toggle" aria-label="Open menu">&#9776;</button>
                    <button type="button" id="refreshBtn" class="btn btn-ghost">Refresh</button>
                </div>
            </header>

            <div class="content">

                <div class="filters">
                    <input type="text" id="ordersSearch" class="input" placeholder="Order #, email, name, phone..." aria-label="Search orders">
                    <select id="ordersStatus" class="select" aria-label="Filter by status">
                        <option value="ALL">All statuses</option>
                        <option value="PENDING">Pending</option>
                        <option value="CONFIRMED">Confirmed</option>
                        <option value="PROCESSING">Processing</option>
                        <option value="SHIPPED">Shipped</option>
                        <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                        <option value="DELIVERED">Delivered</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                    <select id="ordersSort" class="select" aria-label="Sort orders">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                    </select>
                    <button type="button" id="ordersApply" class="btn btn-primary">Apply</button>
                    <button type="button" id="ordersReset" class="btn btn-ghost">Reset</button>
                </div>

                <div id="ordersLoading" class="page-loading">
                    <div class="loading-ring"></div>
                    Loading orders...
                </div>

                <div id="ordersError" class="page-error hidden">
                    <div class="page-error-text" id="ordersErrorMessage">Something went wrong.</div>
                    <button type="button" id="ordersRetry" class="btn btn-ghost">Try again</button>
                </div>

                <div id="ordersPanel" class="panel hidden">
                    <div class="panel-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Customer</th>
                                    <th>Items</th>
                                    <th>Status</th>
                                    <th>Payment</th>
                                    <th>Total</th>
                                    <th>Date</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="ordersBody"></tbody>
                        </table>
                        <div id="ordersEmpty" class="empty-state hidden">No orders found.</div>
                    </div>
                    <div class="panel-footer">
                        <button type="button" id="prevBtn" class="btn btn-ghost">&larr; Prev</button>
                        <span id="pageInfo" class="page-info"></span>
                        <button type="button" id="nextBtn" class="btn btn-ghost">Next &rarr;</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/admin/js/admin.js"></script>
</body>
</html>
